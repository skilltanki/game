# nginx in front of packages/backend (SkillTanki backend v3) — the production
# layout I recommend. One origin for the game: the PWA shell is served by
# nginx itself from the mobile build, the API, the signalling sockets and the
# game assets go to the Bun processes behind it.
#
#   server {                         https://play.example.com
#     /               the PWA shell  → apps/mobile/dist (static, SPA fallback)
#     /api/           the lobby REST → backend
#     /ws/            the signalling → backend, WebSocket upgrade, long idle
#     /assets/        the game data  → backend (MinIO), cached on disk here
#     /health_check   the probe      → backend
#   }
#
# Why nginx and not the backend alone: the phones need HTTPS (service worker,
# the install prompt, WebRTC permissions all require a secure origin); TLS,
# HTTP/2, gzip and the asset cache belong here; the Bun processes stay plain
# HTTP on localhost. The backend runs `--bootstrap=30050,30051,30052`; the
# upstream below balances over the three. Any process may serve any player:
# the rooms live in Redis and the signalling messages travel over its pub/sub,
# so no sticky sessions are needed — a reconnect with the rejoin token may
# land on any of them.
#
# Install: copy to /etc/nginx/sites-available/skilltanki, symlink into
# sites-enabled, `certbot --nginx -d play.example.com` fills the TLS block,
# `nginx -t && systemctl reload nginx`. Replace play.example.com and the two
# paths (ROOT, the certificate) below.

upstream skilltanki_backend {
    # Fewest active connections first: a WebSocket counts as one for its whole life,
    # so new players spread over the processes evenly.
    least_conn;
    server 127.0.0.1:30050 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:30051 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:30052 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# The game assets are immutable under their key (the PWA retires its cache by
# CC_ASSET_CACHE_VERSION), so nginx keeps a copy on disk: the backend and MinIO
# see each file once per nginx host. 2 GB is ten times the asset tree.
proxy_cache_path /var/cache/nginx/skilltanki-assets levels=1:2 keys_zone=skilltanki_assets:50m max_size=2g inactive=30d use_temp_path=off;

# WebSocket: an Upgrade request keeps the connection, anything else closes it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name play.example.com;
    # certbot's challenge stays on plain HTTP; everything else goes secure.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name play.example.com;

    # --- TLS (certbot --nginx writes these lines; keep TLS 1.2+ only) ---------------
    ssl_certificate     /etc/letsencrypt/live/play.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/play.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- the PWA shell: the mobile build (`npm run build:mobile` → apps/mobile/dist) --
    set $root /srv/skilltanki/apps/mobile/dist;
    root $root;
    index index.html;

    # Nothing from a game page may be framed or sniffed; the camera/mic are not used.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Text goes compressed (the chunks are 3–4 MB of minified JS); images and audio are already compressed.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml application/manifest+json;

    # A signalling frame is ≤ 16 KiB and a room request is tiny; nothing bigger has business here.
    client_max_body_size 64k;

    # --- the lobby REST ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://skilltanki_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # The lobby list is polled every 10 s by every player on the rooms screen: never cached here.
        add_header Cache-Control "no-store" always;
    }

    # --- the signalling socket ---------------------------------------------------------
    location /ws/ {
        proxy_pass http://skilltanki_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # The client pings every 25 s and a battle lasts up to 10 minutes: a quiet socket is
        # not a dead one. 120 s covers a phone that dozed; the backend's own idle timeout is the same.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
    }

    # --- the game assets: from the backend (MinIO), cached on disk here -------------
    location /assets/ {
        proxy_pass http://skilltanki_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_cache skilltanki_assets;
        proxy_cache_key $uri;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_revalidate on;
        proxy_ignore_headers Set-Cookie;
        add_header X-Cache $upstream_cache_status;
        # The backend already says `public, max-age=31536000, immutable`; it passes through.
    }

    location = /health_check {
        proxy_pass http://skilltanki_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # --- the shell -------------------------------------------------------------------
    # Hashed chunks (app/<hash>.js) and icons: a year; the entry points (index.html, the
    # manifest, the service worker) must always be revalidated or an update never arrives.
    location ~* ^/app/.*\.(js|css|map)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ~* ^/(index\.html|manifest\.webmanifest|sw\.js|workbox-.*\.js)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location / {
        # A PWA route not on disk falls back to the shell; the shell's own 404 page is the app.
        try_files $uri $uri/ /index.html;
    }
}
